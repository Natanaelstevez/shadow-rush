<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Shadow Rush</title>
  <!-- El icono es el juego en miniatura: la nave del jugador abajo, el haz del
       ovni bajando desde arriba, y el resto en sombra. -->
  <rect width="512" height="512" rx="96" fill="#0d0912"/>

  <!-- El haz: un cono de luz ámbar que baja del ovni. -->
  <path d="M256 214 L392 456 L120 456 Z" fill="#f0b429" opacity="0.18"/>
  <path d="M256 214 L316 456 L196 456 Z" fill="#f0b429" opacity="0.22"/>

  <!-- El ovni. -->
  <ellipse cx="256" cy="176" rx="112" ry="52" fill="#3a161c" stroke="#e5484d" stroke-width="14"/>
  <circle cx="256" cy="168" r="44" fill="#5c222b" stroke="#e5484d" stroke-width="12"/>
  <circle cx="176" cy="196" r="11" fill="#e5484d"/>
  <circle cx="336" cy="196" r="11" fill="#e5484d"/>

  <!-- La nave del jugador. -->
  <path d="M256 300 L300 396 L256 376 L212 396 Z" fill="#123038" stroke="#5fd3c0" stroke-width="14"
        stroke-linejoin="round"/>
  <ellipse cx="256" cy="342" rx="20" ry="15" fill="#5fd3c0"/>
  <path d="M232 400 L256 448 L280 400 Z" fill="#f0b429" opacity="0.75"/>
</svg>
